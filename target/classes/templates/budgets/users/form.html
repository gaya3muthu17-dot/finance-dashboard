<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('User Form')}"></head>
<body>
<div class="app-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('users')}"></div>
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('User Form', 'Add or edit system user')}"></div>
        <div class="page-content">
            <div class="page-header">
                <div class="page-header-left">
                    <div class="page-title" th:text="${user.id != null} ? 'Edit User' : 'Add User'">User</div>
                </div>
                <a th:href="@{/admin/users}" class="btn btn-outline">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
            <div class="card" style="max-width:560px;">
                <div class="card-body">
                    <form th:action="@{/admin/users/save}" method="post" th:object="${user}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{id}"/>
                        <div class="form-group">
                            <label class="form-label">Full Name *</label>
                            <input type="text" th:field="*{name}" class="form-control" placeholder="John Doe" required/>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email Address *</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   placeholder="user@example.com" required/>
                        </div>
                        <div class="form-group" th:if="${user.id == null}">
                            <label class="form-label">Password *</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   placeholder="Minimum 6 characters" required/>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Role *</label>
                                <select th:field="*{role}" class="form-control form-select" required>
                                    <option value="">Select Role</option>
                                    <option value="ADMIN">Admin</option>
                                    <option value="FINANCE_MANAGER">Finance Manager</option>
                                    <option value="STAFF">Staff</option>
                                    <option value="VIEWER">Viewer</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Status</label>
                                <select th:field="*{status}" class="form-control form-select">
                                    <option value="ACTIVE">Active</option>
                                    <option value="INACTIVE">Inactive</option>
                                </select>
                            </div>
                        </div>
                        <div style="display:flex;gap:12px;">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Save User
                            </button>
                            <a th:href="@{/admin/users}" class="btn btn-outline">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
