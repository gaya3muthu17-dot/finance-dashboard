<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accounts')}"></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('accounts')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Accounts','Manage your bank, wallet, and payment methods')}"></div>
    <div class="page-content">

      <div th:if="${success}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${success}"></span></div>

      <!-- Stat Cards -->
      <div class="stat-cards">
        <div class="stat-card"><div class="stat-card-icon green"><i class="fas fa-dollar-sign"></i></div><div class="stat-card-label">Total Balance</div>
          <div class="stat-card-value green">₹<span th:text="${#aggregates.sum(accounts.![balance]) ?: '0'}">0</span></div><div class="stat-card-sub">All Accounts</div></div>
        <div class="stat-card"><div class="stat-card-icon red"><i class="fas fa-university"></i></div><div class="stat-card-label">Bank Accounts</div>
          <div class="stat-card-value red" th:text="'₹' + (${accounts.?[accountType.name() == 'BANK'].isEmpty()} ? '0' : ${#numbers.formatDecimal(accounts.?[accountType.name() == 'BANK'][0].balance,1,'COMMA',0,'POINT')})">₹0</div>
          <div class="stat-card-sub" th:text="${accounts.?[accountType.name() == 'BANK'].size()} + ' Account'">0 Account</div></div>
        <div class="stat-card"><div class="stat-card-icon blue"><i class="fas fa-mobile-alt"></i></div><div class="stat-card-label">UPI Balance</div>
          <div class="stat-card-value blue" th:text="'₹' + (${accounts.?[accountType.name() == 'UPI'].isEmpty()} ? '0' : ${#numbers.formatDecimal(accounts.?[accountType.name() == 'UPI'][0].balance,1,'COMMA',0,'POINT')})">₹0</div>
          <div class="stat-card-sub" th:text="${accounts.?[accountType.name() == 'UPI'].size()} + ' UPI ID'">0 UPI ID</div></div>
        <div class="stat-card"><div class="stat-card-icon yellow"><i class="fas fa-credit-card"></i></div><div class="stat-card-label">Credit Card</div>
          <div class="stat-card-value yellow" th:text="'₹' + (${accounts.?[accountType.name() == 'CREDIT_CARD'].isEmpty()} ? '0' : ${#numbers.formatDecimal(accounts.?[accountType.name() == 'CREDIT_CARD'][0].balance,1,'COMMA',0,'POINT')})">₹0</div>
          <div class="stat-card-sub" th:text="${accounts.?[accountType.name() == 'CREDIT_CARD'].size()} + ' Card'">0 Card</div></div>
      </div>

      <!-- Bank Accounts Section -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:36px;height:36px;background:#FFEEF2;border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-university" style="color:#FF4B6E;"></i></div>
            <span class="card-title">Bank Accounts</span>
          </div>
          <button class="btn btn-primary" onclick="openModal('BANK')"><i class="fas fa-plus"></i> Add New Account</button>
        </div>
        <div class="card-body">
          <div th:each="a : ${accounts.?[accountType.name() == 'BANK']}" class="bill-item">
            <div style="width:50px;height:50px;background:#EEF0FF;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">🏦</div>
            <div class="bill-info">
              <div style="color:#6C3EF4;font-weight:700;font-size:14px;" th:text="${a.bankName}">Bank</div>
              <div style="font-weight:600;font-size:14px;color:#1a1a2e;" th:text="${a.accountName}">Account</div>
              <div style="font-size:12px;color:#aaa;" th:text="${a.accountNumber != null} ? 'xxxxxxxxxx' + ${a.accountNumber.substring(a.accountNumber.length()-2)} : ''">xxx</div>
              <div style="color:#00C896;font-weight:700;font-size:15px;" th:text="'₹' + ${#numbers.formatDecimal(a.balance,1,'COMMA',0,'POINT')}">₹0</div>
            </div>
            <div style="display:flex;gap:8px;margin-left:auto;">
              <button style="background:none;border:none;cursor:pointer;color:#888;font-size:15px;"><i class="fas fa-pencil-alt"></i></button>
              <a th:href="@{/accounts/delete/{id}(id=${a.id})}" style="background:none;border:none;cursor:pointer;color:#FF4B6E;font-size:15px;text-decoration:none;" onclick="return confirm('Remove?')"><i class="fas fa-trash"></i></a>
            </div>
          </div>
          <div th:if="${accounts.?[accountType.name() == 'BANK'].isEmpty()}" style="text-align:center;padding:24px;color:#aaa;">No bank accounts linked yet.</div>
        </div>
      </div>

      <!-- Credit Card Section -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:36px;height:36px;background:#FFEEF2;border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-credit-card" style="color:#FF4B6E;"></i></div>
            <span class="card-title">Credit Card</span>
          </div>
          <button class="btn btn-outline btn-sm" onclick="openModal('CREDIT_CARD')"><i class="fas fa-plus"></i> Add Card</button>
        </div>
        <div class="card-body">
          <div th:each="a : ${accounts.?[accountType.name() == 'CREDIT_CARD']}" class="bill-item">
            <div style="width:50px;height:50px;background:#EEF0FF;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">💳</div>
            <div class="bill-info">
              <div style="color:#6C3EF4;font-weight:700;font-size:14px;" th:text="${a.bankName}">Bank</div>
              <div style="font-weight:600;font-size:14px;" th:text="${a.accountName}">Card</div>
              <div style="font-size:12px;color:#aaa;" th:text="${a.accountNumber != null} ? 'xxxxxxxxxx' + ${a.accountNumber.substring(a.accountNumber.length()-2)} : ''">xxx</div>
              <div style="color:#00C896;font-weight:700;" th:text="'₹' + ${#numbers.formatDecimal(a.balance,1,'COMMA',0,'POINT')}">₹0</div>
            </div>
            <a th:href="@{/accounts/delete/{id}(id=${a.id})}" style="color:#FF4B6E;font-size:15px;text-decoration:none;margin-left:auto;" onclick="return confirm('Remove?')"><i class="fas fa-trash"></i></a>
          </div>
          <div th:if="${accounts.?[accountType.name() == 'CREDIT_CARD'].isEmpty()}" style="text-align:center;padding:24px;color:#aaa;">No cards linked yet.</div>
        </div>
      </div>

      <!-- UPI Section -->
      <div class="card">
        <div class="card-header">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:36px;height:36px;background:#FFEEF2;border-radius:10px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-mobile-alt" style="color:#FF4B6E;"></i></div>
            <span class="card-title">UPI</span>
          </div>
          <button class="btn btn-outline btn-sm" onclick="openModal('UPI')"><i class="fas fa-plus"></i> Add UPI</button>
        </div>
        <div class="card-body">
          <div th:each="a : ${accounts.?[accountType.name() == 'UPI']}" class="bill-item">
            <div style="width:50px;height:50px;background:#EEF0FF;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">📱</div>
            <div class="bill-info">
              <div style="color:#6C3EF4;font-weight:700;" th:text="${a.bankName}">Bank</div>
              <div style="font-weight:600;" th:text="${a.accountName}">Account</div>
              <div style="font-size:12px;color:#aaa;" th:text="'UPI ID: ' + ${a.upiId}">UPI ID</div>
              <div style="color:#00C896;font-weight:700;" th:text="'₹' + ${#numbers.formatDecimal(a.balance,1,'COMMA',0,'POINT')}">₹0</div>
            </div>
            <a th:href="@{/accounts/delete/{id}(id=${a.id})}" style="color:#FF4B6E;font-size:15px;text-decoration:none;margin-left:auto;" onclick="return confirm('Remove?')"><i class="fas fa-trash"></i></a>
          </div>
          <div th:if="${accounts.?[accountType.name() == 'UPI'].isEmpty()}" style="text-align:center;padding:24px;color:#aaa;">No UPI accounts linked yet.</div>
        </div>
      </div>

    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>

<!-- Add Account Modal -->
<div id="accountModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:20px;padding:32px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,0.2);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
      <h3 style="font-size:18px;font-weight:700;">Link New Account</h3>
      <button onclick="closeModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#aaa;">×</button>
    </div>
    <form th:action="@{/accounts/save}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="accountType" id="modalAccountType" value="BANK"/>
      <div class="form-group">
        <label class="form-label">Bank / Institution Name</label>
        <input type="text" name="bankName" class="form-control" placeholder="e.g. State Bank of India" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Account Name</label>
        <input type="text" name="accountName" class="form-control" placeholder="e.g. Savings Account" required/>
      </div>
      <div class="form-group" id="accNumGroup">
        <label class="form-label">Account Number</label>
        <input type="text" name="accountNumber" class="form-control" placeholder="Account number"/>
      </div>
      <div class="form-group" id="upiGroup" style="display:none;">
        <label class="form-label">UPI ID</label>
        <input type="text" name="upiId" class="form-control" placeholder="yourname@bank"/>
      </div>
      <div class="form-group">
        <label class="form-label">Balance (₹)</label>
        <input type="number" name="balance" class="form-control" placeholder="0.00" step="0.01" min="0" value="0"/>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;">Link Account</button>
        <button type="button" class="btn btn-outline" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
function openModal(type) {
  document.getElementById('modalAccountType').value = type;
  document.getElementById('upiGroup').style.display = type === 'UPI' ? 'block' : 'none';
  document.getElementById('accNumGroup').style.display = type === 'UPI' ? 'none' : 'block';
  document.getElementById('accountModal').style.display = 'flex';
}
function closeModal() { document.getElementById('accountModal').style.display = 'none'; }
window.onclick = function(e) { if(e.target === document.getElementById('accountModal')) closeModal(); }
</script>
</body>
</html>
