<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Add Transaction')}"></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('transactions')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Add Transaction','Record a new transaction')}"></div>
    <div class="page-content">
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
        <a th:href="@{/transactions}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back</a>
      </div>
      <div class="card" style="max-width:660px;">
        <div class="card-header"><span class="card-title" th:text="${transaction.id != null} ? 'Edit Transaction' : 'Add Transaction'">Transaction</span></div>
        <div class="card-body">
          <form th:action="@{/transactions/save}" method="post" th:object="${transaction}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{id}"/>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Title *</label><input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Salary Credit" required/></div>
              <div class="form-group"><label class="form-label">Amount *</label><input type="number" th:field="*{amount}" class="form-control" placeholder="0.00" step="0.01" min="0" required/></div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Type *</label>
                <select th:field="*{type}" class="form-control form-select" required>
                  <option value="">Select Type</option>
                  <option value="INCOME">Income</option>
                  <option value="EXPENSE">Expense</option>
                  <option value="TRANSFER">Transfer</option>
                </select>
              </div>
              <div class="form-group"><label class="form-label">Category</label>
                <select th:field="*{category}" class="form-control form-select">
                  <option value="">Select Category</option>
                  <option value="Food">Food &amp; Dining</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Bills">Bills &amp; Utilities</option>
                  <option value="Travel">Transportation</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Sales">Sales</option>
                  <option value="Investments">Investments</option>
                  <option value="Salary">Salary</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Office">Office</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group"><label class="form-label">Date *</label><input type="date" th:field="*{date}" class="form-control" required/></div>
              <div class="form-group"><label class="form-label">Status</label>
                <select th:field="*{status}" class="form-control form-select">
                  <option value="ACTIVE">Active</option>
                  <option value="COMPLETED">Completed</option>
                </select>
              </div>
            </div>
            <div class="form-group"><label class="form-label">Description</label><textarea th:field="*{description}" class="form-control" rows="3" placeholder="Optional description..."></textarea></div>
            <div style="display:flex;gap:12px;">
              <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Transaction</button>
              <a th:href="@{/transactions}" class="btn btn-outline">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>
</body>
</html>
