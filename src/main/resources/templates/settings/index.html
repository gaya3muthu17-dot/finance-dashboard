<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Settings')}"></head>
<body>
<div class="app-wrapper">
  <div th:replace="~{fragments/layout :: sidebar('settings')}"></div>
  <div class="main-content">
    <div th:replace="~{fragments/layout :: topbar('Settings','Manage your account and preferences')}"></div>
    <div class="page-content">

      <div th:if="${success}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${success}"></span></div>
      <div th:if="${pwdSuccess}" class="alert alert-success"><i class="fas fa-check-circle"></i> <span th:text="${pwdSuccess}"></span></div>
      <div th:if="${pwdError}" class="alert alert-danger"><i class="fas fa-times-circle"></i> <span th:text="${pwdError}"></span></div>

      <div class="content-grid-2" style="margin-bottom:20px;">

        <!-- Profile Settings -->
        <div class="card">
          <div class="card-header"><span class="card-title">Profile Settings</span></div>
          <div class="card-body">
            <form th:action="@{/settings/profile}" method="post" enctype="multipart/form-data">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

              <!-- Avatar + Upload -->
              <div style="display:flex;align-items:center;gap:20px;margin-bottom:24px;">
                <div style="width:72px;height:72px;border-radius:50%;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#6C3EF4,#E91E8C);display:flex;align-items:center;justify-content:center;">
                  <img th:if="${currentUser != null and currentUser.profilePic != null}"
                       th:src="@{'/uploads/profiles/' + ${currentUser.profilePic}}"
                       style="width:100%;height:100%;object-fit:cover;" alt="profile"/>
                  <span th:unless="${currentUser != null and currentUser.profilePic != null}"
                        style="color:#fff;font-size:28px;font-weight:700;"
                        th:text="${currentUser != null} ? ${currentUser.name?.substring(0,1)?.toUpperCase()} : 'U'">U</span>
                </div>
                <div>
                  <label for="photoInput" class="btn btn-primary btn-sm" style="cursor:pointer;">
                    <i class="fas fa-upload"></i> Update
                  </label>
                  <input type="file" id="photoInput" name="photo" accept="image/*" style="display:none;" onchange="this.form.submit()"/>
                  <div style="font-size:11px;color:#aaa;margin-top:6px;">Max file size: Below 500kp</div>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Name</label>
                <input type="text" name="name" class="form-control" th:value="${currentUser?.name}" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Email Id</label>
                <input type="email" name="email" class="form-control" th:value="${currentUser?.email}" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" class="form-control" th:value="${currentUser?.phone}" placeholder="12345678800"/>
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
        </div>

        <!-- Right column -->
        <div style="display:flex;flex-direction:column;gap:20px;">

          <!-- Security -->
          <div class="card">
            <div class="card-header"><span class="card-title">Security</span></div>
            <div class="card-body">
              <form th:action="@{/settings/password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                  <label class="form-label">Password</label>
                  <div style="position:relative;">
                    <input type="password" name="currentPassword" class="form-control" value="XXXXXXX" id="pwdField"/>
                    <i class="fas fa-eye-slash" onclick="togglePwd()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;"></i>
                  </div>
                </div>
                <input type="hidden" name="newPassword" id="newPwdHidden"/>
                <button type="button" class="btn btn-primary" onclick="showChangePwd()">Change Password</button>
                <div id="newPwdSection" style="display:none;margin-top:14px;">
                  <div class="form-group"><label class="form-label">New Password</label><input type="password" id="newPwdInput" class="form-control" placeholder="New password"/></div>
                  <button type="submit" class="btn btn-primary" onclick="document.getElementById('newPwdHidden').value=document.getElementById('newPwdInput').value">Save New Password</button>
                </div>
              </form>
            </div>
          </div>

          <!-- 2FA -->
          <div class="card">
            <div class="card-header"><span class="card-title">Two-Factor Authentication</span></div>
            <div class="card-body">
              <div style="display:flex;align-items:center;gap:12px;">
                <span style="font-size:13.5px;color:#888;">Off</span>
                <label class="toggle-switch">
                  <input type="checkbox"/>
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- Currency -->
          <div class="card">
            <div class="card-header"><span class="card-title">Currency</span></div>
            <div class="card-body">
              <div class="form-group" style="display:flex;align-items:center;gap:12px;margin-bottom:0;">
                <label class="form-label" style="margin-bottom:0;width:80px;">Currency</label>
                <select class="form-control form-select" style="flex:1;">
                  <option>INR ₹</option><option>USD $</option><option>EUR €</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- General Settings -->
      <div class="card" style="margin-bottom:20px;">
        <div class="card-header"><span class="card-title">General Settings</span></div>
        <div class="card-body">
          <div th:each="item : ${ {'Bill Reminders:on','Budget Alerts:on','Transaction Alerts:off','UPI Connected:on','Bank Account Connected:on'} }">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #F5F5FB;">
              <span style="font-size:14px;color:#333;" th:text="${#strings.substringBefore(item,':')}">Setting</span>
              <div style="display:flex;align-items:center;gap:10px;">
                <span style="font-size:13px;color:#888;" th:text="${#strings.substringAfter(item,':') == 'on'} ? 'On' : 'Off'">On</span>
                <label class="toggle-switch">
                  <input type="checkbox" th:checked="${#strings.substringAfter(item,':') == 'on'}"/>
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Data Management + Danger Zone -->
      <div class="content-grid-2">
        <div class="card">
          <div class="card-header"><span class="card-title">Data Management</span></div>
          <div class="card-body">
            <p style="font-size:13px;color:#888;margin-bottom:16px;">Export your financial data</p>
            <button class="btn btn-primary"><i class="fas fa-upload"></i> Export Data</button>
          </div>
        </div>
        <div class="card">
          <div class="card-header"><span class="card-title">Danger Zone</span></div>
          <div class="card-body">
            <p style="font-size:13px;color:#888;margin-bottom:16px;">Permanently delete all your financial data</p>
            <button class="btn btn-danger" onclick="return confirm('Are you sure? This cannot be undone.')">Clear All Data</button>
          </div>
        </div>
      </div>

    </div>
    <div th:replace="~{fragments/layout :: footer}"></div>
  </div>
</div>

<style>
.toggle-switch { position:relative;display:inline-block;width:44px;height:24px; }
.toggle-switch input { opacity:0;width:0;height:0; }
.toggle-slider { position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px;transition:.3s; }
.toggle-slider:before { position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s; }
input:checked + .toggle-slider { background:#00C896; }
input:checked + .toggle-slider:before { transform:translateX(20px); }
</style>
<script>
function togglePwd(){ var f=document.getElementById('pwdField'); f.type=f.type==='password'?'text':'password'; }
function showChangePwd(){ document.getElementById('newPwdSection').style.display='block'; }
</script>
</body>
</html>
