<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Setup | Vetri FinTrack</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Inter",sans-serif;min-height:100vh;background:#fff;display:flex;flex-direction:column;}
.top-logo{padding:8px 40px;display:flex;align-items:center;gap:10px;}
.top-logo img{height:200px;width:auto;}
.page-header{text-align:center;margin:8px 0 16px;}
.page-header h1{font-size:26px;font-weight:700;color:#1a1a2e;}
.page-header p{font-size:14px;color:#666;margin-top:6px;}
.wizard-card{background:#fff;border-radius:20px;border:2px solid transparent;background-clip:padding-box;outline:2px solid;outline-color:transparent;width:100%;max-width:720px;margin:0 auto;padding:24px 48px;box-shadow:0 4px 32px rgba(108,62,244,0.08);position:relative;}
.wizard-card::before{content:"";position:absolute;inset:-2px;border-radius:22px;background:linear-gradient(135deg,#E91E8C,#6C3EF4);z-index:-1;}
.card-title{font-size:20px;font-weight:700;color:#1a1a2e;text-align:center;margin-bottom:28px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.form-group{display:flex;flex-direction:column;gap:7px;}
label{font-size:13.5px;font-weight:600;color:#1a1a2e;}
input,select{padding:11px 14px;border:1.5px solid #E8E8F0;border-radius:10px;font-size:14px;background:#F5F5FA;color:#1a1a2e;outline:none;font-family:inherit;width:100%;}
input:focus,select:focus{border-color:#6C3EF4;background:#fff;}
.btn-row{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:12px;}
.btn-back{padding:12px 36px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:#555;text-decoration:none;display:inline-flex;align-items:center;}
.btn-continue{padding:12px 36px;background:#6C3EF4;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-skip{padding:12px 28px;border:1.5px solid #ddd;border-radius:10px;background:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;color:#555;}
footer{text-align:center;padding:28px 0 16px;color:#aaa;font-size:12px;margin-top:auto;}
footer a{color:#aaa;text-decoration:none;margin:0 12px;}</style></head>
<body>
<div class="top-logo"><img th:src="@{/images/logo.png}" alt="Vetri FinTrack"/></div>
<div class="page-header"><h1>Let's Set Up Your Finances ⭐</h1><p>Let's Set Up Your Finances</p></div>
<div class="wizard-card">
  <div class="card-title">Add your first account</div>
  <form th:action="@{/onboarding/step4}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <div class="form-grid">
      <div class="form-group">
        <label>Type*</label>
        <select name="accountType" required>
          <option value="BANK">Bank</option>
          <option value="CREDIT_CARD">Credit Card</option>
          <option value="UPI">UPI</option>
          <option value="WALLET">Wallet</option>
        </select>
      </div>
      <div class="form-group">
        <label>Account Holder Name</label>
        <input type="text" name="holderName" placeholder="Enter account holder name"/>
      </div>
      <div class="form-group">
        <label>Account Type</label>
        <input type="text" name="accountTypeName" placeholder="e.g., savings account"/>
      </div>
      <div class="form-group">
        <label>Account Number/UPI ID*</label>
        <input type="text" name="accountNumber" placeholder="Enter AC number"/>
      </div>
      <div class="form-group">
        <label>Provider*</label>
        <select name="provider">
          <option value="SBI">SBI</option>
          <option value="HDFC">HDFC</option>
          <option value="ICICI">ICICI</option>
          <option value="IOB">IOB</option>
          <option value="Axis">Axis</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label>Initial Balance</label>
        <input type="number" name="initialBalance" placeholder="₹ 0" min="0" step="0.01"/>
      </div>
    </div>
    <div class="btn-row">
      <a th:href="@{/onboarding/step3}" class="btn-back">Back</a>
      <div style="display:flex;gap:12px;">
        <button type="submit" name="skip" value="true" class="btn-skip">Skip</button>
        <button type="submit" class="btn-continue">Continue</button>
      </div>
    </div>
  </form>
</div>
<footer><p>© 2026 Smart Finance. All rights reserved.</p><div style="margin-top:8px;"><a href="#">Privacy Policy</a><a href="#">Terms</a><a href="#">Help Center</a><a href="#">Contact</a></div></footer>
</body></html>
