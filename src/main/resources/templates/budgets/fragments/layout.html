<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} + ' | Vetri FinTrack'">Vetri FinTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div th:fragment="sidebar(activePage)">
<aside class="sidebar">
    <div class="sidebar-brand">
        <img th:src="@{/images/logo.png}" alt="Vetri FinTrack" style="height:40px;width:auto;object-fit:contain;"/>
    </div>
    <nav class="sidebar-nav">
        <a th:href="@{/dashboard}" th:classappend="${activePage=='dashboard'}?'active':''">
            <span class="nav-icon"><i class="fas fa-th-large"></i></span> Dashboard
        </a>
        <a th:href="@{/transactions}" th:classappend="${activePage=='transactions'}?'active':''">
            <span class="nav-icon"><i class="fas fa-sync-alt"></i></span> Transactions
        </a>
        <a th:href="@{/bills}" th:classappend="${activePage=='bills'}?'active':''">
            <span class="nav-icon"><i class="fas fa-file-invoice"></i></span> Bills
        </a>
        <a th:href="@{/reports}" th:classappend="${activePage=='reports'}?'active':''">
            <span class="nav-icon"><i class="fas fa-chart-bar"></i></span> Reports
        </a>
        <a th:href="@{/budgets}" th:classappend="${activePage=='budgets'}?'active':''">
            <span class="nav-icon"><i class="fas fa-wallet"></i></span> Budgets
            <span class="dot"></span>
        </a>
        <a th:href="@{/accounts}" th:classappend="${activePage=='accounts'}?'active':''">
            <span class="nav-icon"><i class="fas fa-university"></i></span> Accounts
        </a>
        <a th:href="@{/settings}" th:classappend="${activePage=='settings'}?'active':''">
            <span class="nav-icon"><i class="fas fa-cog"></i></span> Settings
        </a>
    </nav>
    <div class="sidebar-footer">
        <a th:href="@{/auth/logout}">
            <span class="nav-icon"><i class="fas fa-sign-out-alt"></i></span> Logout
        </a>
    </div>
</aside>
</div>

<div th:fragment="topbar(title, subtitle)">
<div class="topbar">
    <div class="topbar-left">
        <div class="page-title" th:text="${title}">Page</div>
        <div class="page-subtitle" th:text="${subtitle}">subtitle</div>
    </div>
    <div class="topbar-right">
        <a th:href="@{/notifications}" class="notif-btn"><i class="fas fa-bell"></i></a>
        <div class="user-chip">
            <div class="user-avatar"
                 th:if="${currentUser != null and currentUser.profilePic != null}"
                 style="width:36px;height:36px;border-radius:50%;overflow:hidden;">
                <img th:src="@{'/uploads/profiles/' + ${currentUser.profilePic}}"
                     style="width:100%;height:100%;object-fit:cover;" alt="avatar"/>
            </div>
            <div class="user-avatar"
                 th:unless="${currentUser != null and currentUser.profilePic != null}"
                 style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6C3EF4,#E91E8C);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;"
                 th:text="${currentUser != null} ? ${currentUser.name?.substring(0,1)?.toUpperCase()} : 'U'">U</div>
            <span class="user-name" th:text="${currentUser != null} ? ${currentUser.name} : 'User'">User</span>
        </div>
    </div>
</div>
</div>

<div th:fragment="footer">
<div class="page-footer">
    <p>© 2026 Smart Finance. All rights reserved.</p>
    <div style="margin-top:8px;">
        <a href="#">Privacy Policy</a>
        <a href="#">Terms</a>
        <a href="#">Help Center</a>
        <a href="#">Contact</a>
    </div>
</div>
</div>

</body>
</html>
