<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>Logged Out | Vetri FinTrack</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
}

.logout-page{
    min-height:100vh;
    background:linear-gradient(135deg,#6C3EF4 0%,#E91E8C 100%);
    display:flex;
    align-items:center;
    justify-content:center;
}

.logout-card{
    background:#fff;
    border-radius:30px;
    width:560px;
    padding:30px;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
}

/* Logo */
.logo-top{
    margin-bottom:20px;
}

.logo-top img{
    width:180px;
}

/* Image */
.logout-image{
    display:flex;
    justify-content:center;
    margin-bottom:20px;
}

.logout-image img{
    width:160px;
}

/* Text */
.logout-title{
    text-align:center;
    font-size:38px;
    font-weight:800;
    color:#111;
    margin-bottom:15px;
}

.logout-sub{
    text-align:center;
    font-size:18px;
    color:#555;
    margin-bottom:30px;
}

/* Button */
.login-btn{
    display:flex;
    justify-content:center;
}

.login-btn a{
    background:#6C3EF4;
    color:white;
    text-decoration:none;
    padding:16px 42px;
    border-radius:14px;
    font-size:20px;
    font-weight:700;
}

.login-btn a:hover{
    background:#5730d4;
}
</style>
</head>

<body>

<div class="logout-page">

    <div class="logout-card">

        <div class="logo-top">
            <img th:src="@{/images/logo.png}"
                 alt="Vetri FinTrack"/>
        </div>

        <div class="logout-image">
            <img th:src="@{/images/Goodbye from your friendly monitor.png}"
                 alt="Logged Out"/>
        </div>

        <h2 class="logout-title">
            You've been logged out
        </h2>

        <p class="logout-sub">
            Thanks for using Vetri FinTrack
        </p>

        <div class="login-btn">
            <a th:href="@{/auth/login}">
                Back to Login
            </a>
        </div>

    </div>

</div>

</body>
</html>
