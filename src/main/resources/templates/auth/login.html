<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>Login | Vetri FinTrack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Inter,sans-serif;min-height:100vh;background:linear-gradient(135deg,#7B4FD4,#C94B8A,#E8534A);display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:24px;width:100%;max-width:920px;min-height:560px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25);}
.left{padding:48px 44px;display:flex;flex-direction:column;justify-content:center;}
.right{position:relative;overflow:hidden;}
.right img.bg{width:100%;height:100%;object-fit:contain;display:block;}
.logo{
    position:absolute;
    top:8px;
    right:30px;
    z-index:10;
}

.logo img{
    height:50px;   /* increase logo size */
    width:auto;
    object-fit:contain;
    /* background:white; */
}
h2{font-size:26px;font-weight:800;color:#1a1a2e;margin-bottom:4px;}
.sub{font-size:14px;color:#555;margin-bottom:32px;}
label{display:block;font-size:13.5px;font-weight:600;color:#1a1a2e;margin-bottom:7px;}
.fg{margin-bottom:18px;}
.wrap{position:relative;}
input{width:100%;padding:12px 16px;border:1.5px solid #E8E8F0;border-radius:10px;font-size:13.5px;background:#F5F5FA;color:#1a1a2e;outline:none;font-family:inherit;}
input:focus{border-color:#6C3EF4;background:#fff;}
.eye{position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#aaa;font-size:15px;}
.forgot{display:block;text-align:right;color:#E91E8C;font-size:13px;text-decoration:none;font-weight:500;margin-top:-10px;margin-bottom:20px;}
.btn{width:100%;padding:13px;background:#6C3EF4;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;}
.row{text-align:center;margin-top:14px;font-size:13.5px;color:#555;}
.row a{color:#E91E8C;font-weight:600;text-decoration:none;}
.div{text-align:center;color:#aaa;font-size:13px;margin:14px 0;}
.gbtn{width:100%;padding:12px;border:1.5px solid #E0E0E0;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:13.5px;cursor:pointer;font-family:inherit;color:#333;}
.terms{text-align:center;margin-top:14px;font-size:11.5px;color:#aaa;}
.err{background:#FFEEF2;color:#CC0033;border:1px solid #FFD0DB;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
.ok{background:#E6FBF5;color:#00875A;border:1px solid #B3F0DE;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
</style>
</head>
<body>
<div class="card">
<div class="left">
<h2>Welcome Back &#x1F44B;</h2>
<p class="sub">Login to your account</p>
<div th:if="${error}" class="err">Invalid email or password.</div>
<div th:if="${message}" class="ok" th:text="${message}"></div>
<form th:action="@{/auth/login}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
<div class="fg">
<label>Email Id*</label>
<input type="email" name="username" placeholder="Enter Email Address" required autofocus/>
</div>
<div class="fg">
<label>Password</label>
<div class="wrap">
<input type="password" name="password" id="pwd" placeholder="Enter Password" required/>
<i class="fas fa-eye-slash eye" id="ei" onclick="t()"></i>
</div>
</div>
<a href="#" class="forgot">Forget Password?</a>
<button type="submit" class="btn">Login</button>
</form>
<div class="row">Don't have an account? <a th:href="@{/auth/signup}">Sign up</a></div>
<div class="div">or</div>
<button class="gbtn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="G"/> Continue With Google</button>
<p class="terms">By logging in, you agree to our Terms of Service and Privacy Policy.</p>
</div>
<div class="right">
<img class="bg" th:src="@{/images/loginpage_image.png}" alt="Finance"/>
<div class="logo"><img th:src="@{/images/logo.png}" alt="Logo"/></div>
</div>
</div>
<script>function t(){var p=document.getElementById('pwd'),i=document.getElementById('ei');if(p.type==='password'){p.type='text';i.className='fas fa-eye eye';}else{p.type='password';i.className='fas fa-eye-slash eye';}}</script>
</body>
</html>
